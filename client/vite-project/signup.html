<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Your Account | BeAura Clinical Atelier</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#e3e2e0",
                        "on-secondary-fixed": "#321200",
                        "on-secondary-container": "#783603",
                        "on-primary-fixed-variant": "#394d14",
                        "tertiary-fixed": "#e4e4cc",
                        "on-tertiary-fixed-variant": "#474836",
                        "on-error": "#ffffff",
                        "surface": "#faf9f6",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#45483c",
                        "outline": "#75796b",
                        "surface-dim": "#dbdad7",
                        "primary-container": "#556b2f",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#b6d088",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#c8c8b0",
                        "surface-container-high": "#e9e8e5",
                        "secondary-fixed-dim": "#ffb68c",
                        "on-tertiary-fixed": "#1b1d0e",
                        "on-surface": "#1a1c1a",
                        "secondary": "#934b19",
                        "on-primary-container": "#d0eba1",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#ffa26a",
                        "primary-fixed": "#d2eca2",
                        "inverse-on-surface": "#f2f1ee",
                        "surface-variant": "#e3e2e0",
                        "primary": "#3e5219",
                        "inverse-surface": "#2f312f",
                        "inverse-primary": "#b6d088",
                        "surface-bright": "#faf9f6",
                        "on-primary-fixed": "#131f00",
                        "tertiary-container": "#646552",
                        "outline-variant": "#c5c8b8",
                        "surface-container": "#efeeeb",
                        "on-tertiary-container": "#e2e3ca",
                        "on-tertiary": "#ffffff",
                        "on-background": "#1a1c1a",
                        "background": "#faf9f6",
                        "surface-tint": "#50652a",
                        "on-secondary-fixed-variant": "#753401",
                        "surface-container-low": "#f4f3f1",
                        "tertiary": "#4c4d3b",
                        "secondary-fixed": "#ffdbc9"
                    },
                    fontFamily: {
                        "headline": ["Noto Serif", "serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            background-color: #faf9f6;
            background-image: radial-gradient(#e3e2e0 0.5px, transparent 0.5px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="font-body text-on-surface flex flex-col min-h-screen">
<!-- TopAppBar -->
<nav class="fixed top-0 w-full z-50 bg-[#faf9f6]/70 dark:bg-[#1a1c1a]/70 backdrop-blur-xl flex justify-between items-center px-8 py-6 w-full max-w-none">
<div class="font-noto-serif text-2xl tracking-tight text-[#1a1c1a] dark:text-[#faf9f6] font-headline">
            BeAura
        </div>
<div class="flex items-center gap-8">
<button class="text-[#45483c] dark:text-[#e3e2e0] hover:text-[#3e5219] dark:hover:text-[#c2d0a0] transition-colors font-label text-[11px] uppercase tracking-[0.05em]">
                Support
            </button>
</div>
</nav>
<!-- Main Content: Login Canvas -->
<main class="flex-grow flex items-center justify-center px-6 pt-32 pb-20">
<div class="w-full max-w-md">
<!-- Center Focus Card -->
<div class="bg-surface-container-lowest rounded-xl p-10 md:p-14 shadow-[0_32px_64px_-16px_rgba(26,28,26,0.06)] border border-outline-variant/10 relative overflow-hidden">
<!-- Botanical Accent -->
<div class="flex justify-center mb-8">
<span class="material-symbols-outlined text-primary text-3xl opacity-60" data-icon="eco">eco</span>
</div>
<!-- Header -->
<header class="text-center mb-10">
<h1 class="font-headline text-3xl text-on-surface tracking-tight mb-3">Create Your Account</h1>
<p class="text-on-surface-variant text-sm font-light leading-relaxed">Join the clinical skincare atelier for a personalized diagnostic experience.</p>
</header>
<!-- Form -->
<form class="space-y-6">
<div class="space-y-1.5">
<label class="block font-label text-[10px] uppercase tracking-[0.1em] text-on-surface-variant ml-1" for="full-name">Full Name</label>
<input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3.5 text-on-surface placeholder:text-outline-variant focus:ring-1 focus:ring-primary/20 transition-all text-sm" id="full-name" name="full-name" placeholder="Evelyn Harper" type="text"/>
</div>
<div class="space-y-1.5">
<label class="block font-label text-[10px] uppercase tracking-[0.1em] text-on-surface-variant ml-1" for="email">Email Address</label>
<input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3.5 text-on-surface placeholder:text-outline-variant focus:ring-1 focus:ring-primary/20 transition-all text-sm" id="email" name="email" placeholder="name@example.com" type="email"/>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="block font-label text-[10px] uppercase tracking-[0.1em] text-on-surface-variant" for="password">Password</label>
</div>
<input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3.5 text-on-surface placeholder:text-outline-variant focus:ring-1 focus:ring-primary/20 transition-all text-sm" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<div class="pt-4">
<button class="w-full bg-primary text-on-primary font-body font-medium py-4 rounded-full hover:shadow-lg hover:shadow-primary/10 active:scale-[0.98] transition-all duration-200" type="submit">
                            Create Account
                        </button>
</div>
</form>
<!-- Footer Link -->
<div class="mt-10 text-center">
<p class="text-on-surface-variant text-xs">
                        Already have an account? 
                        <a class="text-secondary font-medium ml-1 hover:underline underline-offset-4" href="#">Login</a>
</p>
</div>
<!-- Subtle Decorative Element -->
<div class="absolute -bottom-12 -right-12 w-32 h-32 bg-primary/5 rounded-full blur-3xl"></div>
</div>
<!-- Aesthetic Note -->
<p class="text-center mt-8 font-label text-[10px] uppercase tracking-[0.15em] text-outline opacity-50">
                Precision Skincare ⋅ Clinical Excellence
            </p>
</div>
</main>
<!-- Footer -->
<footer class="bg-[#f4f3f1] dark:bg-[#1a1c1a] flex flex-col md:flex-row justify-between items-center px-16 py-12 w-full mt-auto">
<div class="font-noto-serif text-lg text-[#1a1c1a] dark:text-[#faf9f6] mb-6 md:mb-0">
            BeAura
        </div>
<div class="flex flex-wrap justify-center gap-8 mb-6 md:mb-0">
<a class="font-inter text-[11px] uppercase tracking-[0.05em] text-[#45483c] dark:text-[#e3e2e0] hover:text-[#3e5219] transition-colors" href="#">Privacy Policy</a>
<a class="font-inter text-[11px] uppercase tracking-[0.05em] text-[#45483c] dark:text-[#e3e2e0] hover:text-[#3e5219] transition-colors" href="#">Terms of Service</a>
<a class="font-inter text-[11px] uppercase tracking-[0.05em] text-[#45483c] dark:text-[#e3e2e0] hover:text-[#3e5219] transition-colors" href="#">Sustainability</a>
<a class="font-inter text-[11px] uppercase tracking-[0.05em] text-[#45483c] dark:text-[#e3e2e0] hover:text-[#3e5219] transition-colors" href="#">Contact</a>
</div>
<div class="font-inter text-[11px] uppercase tracking-[0.05em] text-[#45483c] dark:text-[#e3e2e0] opacity-80">
            © 2024 BeAura Clinical Atelier. All rights reserved.
        </div>
</footer>
</body></html>
